<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen-Image · кастомизация</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Qwen-Image</h1>
    <p class="muted">{{ model_id }} · одно фото · результат того же размера · промпт на английском</p>
    <nav class="pages">
      <a href="{{ url_for('web.index') }}">Генерация</a>
      <a href="{{ url_for('web.customize') }}" aria-current="page">Кастомизация</a>
      <a href="/mask-fill">Заливка</a>
    </nav>
  </header>

  <form id="form" class="card">
    <label class="field">
      <span>System prompt (English)</span>
      <textarea name="system_prompt" rows="4" required
                placeholder="Remove the lamp behind the person, keep the face, clothes, and framing"></textarea>
    </label>

    <label class="field">
      <span>Negative prompt (English, optional)</span>
      <input type="text" name="negative_prompt" placeholder="blurry, extra fingers, watermark">
    </label>

    <div class="field">
      <span>Референсное фото</span>
      <input type="file" id="image" name="image" accept="image/*" required>
      <p class="muted">Правки из system prompt лягут на это фото. На выходе будет тот же размер, что у файла.</p>
      <div id="previews" class="previews"></div>
    </div>

    <div class="grid">
      <label class="field">
        <span>Шагов</span>
        <input type="number" name="steps" value="{{ default_steps }}" min="1" max="{{ max_steps }}">
      </label>

      <label class="field">
        <span>CFG (1 — без guidance)</span>
        <input type="number" name="true_cfg_scale" value="{{ default_cfg }}" min="1" max="10" step="0.1">
      </label>

      <label class="field">
        <span>Seed (-1 — случайный)</span>
        <input type="number" name="seed" value="-1" min="-1">
      </label>
    </div>

    <button id="submit" type="submit">Поправить</button>
    <p id="status" class="status" hidden></p>
    <pre id="logs" class="logs" hidden></pre>
  </form>

  <section id="result" class="card" hidden>
    <h2>Результат</h2>
    <p id="meta" class="muted"></p>
    <div id="gallery" class="gallery"></div>
  </section>
</main>
<script src="{{ url_for('static', filename='customize.js') }}" defer></script>
</body>
</html>
