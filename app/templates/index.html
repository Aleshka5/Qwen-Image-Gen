<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Workspace · Image · Filenkov</title>
  <link rel="preload" as="font" type="font/woff2" href="{{ url_for('static', filename='fonts/fraunces-latin.woff2') }}" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ url_for('static', filename='fonts/public-sans-latin.woff2') }}" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='filenkov.css') }}">
  {% for href in styles %}
  <link rel="stylesheet" href="{{ href }}">
  {% endfor %}
  <style>
    .main.workspace {
      padding: 0;
      height: calc(100svh - var(--header-h));
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
<div class="shell">
  <a class="skip-link" href="#root">Skip to content</a>
  <header class="header">
    <a class="brand" href="https://filenkov.store">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3 L29 16 L16 29 L3 16 Z" fill="none" stroke="currentColor" stroke-width="1.75" />
        <circle cx="16" cy="16" r="3.2" fill="var(--accent)" />
      </svg>
      <span class="brand-name">Filenkov</span>
    </a>
    <nav class="service-nav" aria-label="Primary">
      <a href="https://storage.filenkov.store">Storage</a>
      <span aria-current="page">Image</span>
    </nav>
    {% include "_account.html" %}
  </header>
  <main id="root" class="main workspace"></main>
</div>
{% for src in scripts %}
<script type="module" src="{{ src }}"></script>
{% endfor %}
</body>
</html>
