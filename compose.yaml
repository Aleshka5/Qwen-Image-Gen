# Qwen image workspace: the web face plus two workers. No weights and no GPU.
#
# The model is a different project. qwen-inference (torch, the 33 GB weights, :8010)
# is started from Common/models/services/inference, or by Switch-Service as
# `state image gpu`. This file never starts it and never publishes a host port.
#
#   qwen-image        Flask + the built workspace UI. Gateway upstream http://qwen-image:8000.
#   qimg-processor    intake queue -> gen queue. Reads Mongo, does not call the model.
#   qimg-orchestrator claims a task, calls qwen-inference or an external provider,
#                     writes the result to Mongo and MinIO.
#
# Networks, all external (this file does not create them):
#   deploy_auth_network   gateway -> qwen-image
#   models_network        name qwen-inference (web and orchestrator only)
#   common_network        mongo, minio, rabbit. Without this network those names do not resolve.
#                         Hostname redis on the auth network is rejected_cache; do not use it.
#
# The backend trio (MONGO_URL, RABBIT_URL, MINIO_ENDPOINT) and the MinIO credentials
# come from .env, never from `environment:` here. qimg.runtime refuses a partial trio,
# so overriding one of the three in this file would make every process exit at start.

services:
  qwen-image:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: localhost/qwen-image-service:latest
    container_name: qwen-image
    env_file: .env
    restart: always
    mem_limit: 2g
    volumes:
      - qwen-outputs:/data/outputs
    networks:
      - deploy_auth_network
      - models_network
      - common_network
    environment:
      INFERENCE_URL: http://qwen-inference:8010

  qimg-processor:
    image: localhost/qwen-image-service:latest
    container_name: qimg-processor
    env_file: .env
    restart: always
    mem_limit: 2g
    command: ["python", "-m", "qimg.processor"]
    healthcheck:
      disable: true
    networks:
      - common_network
    environment:
      MONGO_DB: qimg

  qimg-orchestrator:
    image: localhost/qwen-image-service:latest
    container_name: qimg-orchestrator
    env_file: .env
    restart: always
    mem_limit: 2g
    command: ["python", "-m", "qimg.orchestrator"]
    healthcheck:
      disable: true
    networks:
      - common_network
      - models_network
    environment:
      INFERENCE_URL: http://qwen-inference:8010
      MONGO_DB: qimg

networks:
  deploy_auth_network:
    external: true
  models_network:
    external: true
  common_network:
    external: true

volumes:
  qwen-outputs:
    name: qwen-outputs
