# Веб-морда Qwen-Image 2.1: Flask, страницы, JSON API, WebStorage и HTTP-клиент
# пайплайна. Ни torch, ни CUDA, ни весов — 212 MB образа (Dockerfile.web) вместо 6.2 GB.
#
# МОДЕЛЬ — ОТДЕЛЬНЫЙ ПРОЕКТ И ОТДЕЛЬНАЯ СЕТЬ
#   Пайплайн (torch, 33 GiB весов, карта) живёт в контейнере qwen-inference, и
#   запускается он не отсюда:
#     ../../Common/models/services/inference/    — compose + run.sh этого контейнера
#     Switch-Service: `state image gpu`          — на master-node (карта под admission)
#   Его сеть — models_network, и только она. Здесь описана одна веб-морда.
#
# Сети этой морды:
#   deploy_auth_network  домашняя: сюда приходит Auth Gateway (http://qwen-image:8000)
#                        и здесь WebStorage отвечает как http://app:8000
#   models_network       клиентская: единственная причина — резолв имени
#                        qwen-inference. Модель про auth-сеть не знает ничего
#
# Связь между контейнерами — одна HTTP-ручка:
# POST http://qwen-inference:8010/v1/generate (multipart) -> text/event-stream.
# Браузер и Auth Gateway по-прежнему видят только http://qwen-image:8000:
# протокол страницы не изменился, /api/logs отдаёт те же строки пайплайна.
#
# Порты на хост не публикуются: снаружи сервис доступен только Auth Gateway.
# Порядок запуска — сначала модель (ей нужна карта), потом эта морда; `depends_on`
# между проектами нет. Морда терпит отсутствие пайплайна: /healthz отдаёт
# `inference unreachable`, каждая генерация отвечает 503, пока он не поднялся.

services:
  qwen-image:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: localhost/qwen-image-service:latest
    container_name: qwen-image
    env_file: .env
    restart: always
    mem_limit: 2g
    volumes:
      - qwen-outputs:/data/outputs
    networks:
      - deploy_auth_network
      - models_network
    environment:
      # Единственная связь с моделью — этот адрес. Ключ дублирует .env намеренно:
      # связь должна быть видна в файле запуска, а не только в env-файле.
      INFERENCE_URL: http://qwen-inference:8010

networks:
  deploy_auth_network:
    external: true
  models_network:
    external: true

volumes:
  qwen-outputs:
    name: qwen-outputs
